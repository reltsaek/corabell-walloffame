<!--
Schnell änderbar:

Zahlen & Texte — direkt in den .card-val und .card-sub Blöcken
Alle Farben — gesammelt als CSS-Variablen ganz oben in :root, z.B. --accent-yellow: #ffde59 oder die 6 Kartenfarben
Hintergründe — --bg-page, --bg-card, --bg-card-inner
Karten hinzufügen/entfernen — einfach einen <div class="card"> Block kopieren oder löschen
-->
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500&display=swap" rel="stylesheet">
<style>
.db-wrap { font-family: 'Roboto Slab', serif; padding: 1.25rem 0; }
.db-cards { display: grid; grid-template-columns: repeat(4,1fr); gap:10px; margin-bottom:1.5rem; }
.db-card { background:#ffde59; border-radius:var(--border-radius-md); padding:.85rem; text-align:center; }
.db-card-label { font-size:11px; color:#7a6800; margin-bottom:3px; font-weight:400; }
.db-card-value { font-size:22px; font-weight:500; color:#1a1200; }
.db-card-sub { font-size:11px; color:#7a6800; margin-top:2px; }
.db-chart-bg { background:#1e2235; border-radius:var(--border-radius-lg); padding:1.25rem 1rem 1rem; }
.db-legend { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:10px; font-size:12px; color:#fefefe; }
.db-legend span { display:flex; align-items:center; gap:5px; }
.db-swatch { width:24px; height:3px; border-radius:2px; display:inline-block; }
</style>

<div class="db-wrap">
  <div class="db-cards">
    <div class="db-card">
      <div class="db-card-label">Tages-Spitzenwert</div>
      <div class="db-card-value">94 dB</div>
      <div class="db-card-sub">23 Uhr – Bettgehstreit</div>
    </div>
    <div class="db-card">
      <div class="db-card-label">Tages-Durchschnitt</div>
      <div class="db-card-value">58 dB</div>
      <div class="db-card-sub">Wie eine belebte Straße</div>
    </div>
    <div class="db-card">
      <div class="db-card-label">Ruhigste Phase</div>
      <div class="db-card-value">31 dB</div>
      <div class="db-card-sub">13 Uhr – Schule läuft</div>
    </div>
    <div class="db-card">
      <div class="db-card-label">WHO Nachtgrenzwert</div>
      <div class="db-card-value" style="color:#c0392b;">40 dB</div>
      <div class="db-card-sub">wird früh überschritten</div>
    </div>
  </div>

  <div class="db-chart-bg">
    <div class="db-legend">
      <span><span class="db-swatch" style="background:#f0a070;"></span>Lautstärke</span>
      <span><span class="db-swatch" style="border-top:2px dashed #f08080;height:0;width:24px;"></span>WHO-Nacht (40 dB)</span>
      <span><span class="db-swatch" style="border-top:2px dashed #7eb8f7;height:0;width:24px;"></span>TA-Lärm Tag (55 dB)</span>
    </div>
    <div style="position:relative;width:100%;height:320px;">
      <canvas id="dbChart" role="img" aria-label="Dezibelkurve: morgens 85 dB, Schulzeit 31 dB, abends ansteigend auf 94 dB, dann Abfall auf 36 dB">Lautstärke-Tagesprofil der Familie.</canvas>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const labels = ['0h','2h','4h','6h','8h','10h','12h','14h','16h','18h','20h','22h','23h','23:30h','24h'];
const daten  = [ 38,  31,  31,  72,  78,   38,   33,   34,   68,   72,   78,   88,   94,     48,   36];

const events = {
  3:  'Frühstücks-Chaos',
  4:  'Schulstart',
  7:  'Kind kommt heim',
  11: 'Bettgeh-Verhandlung',
  12: 'PEAK: 94 dB',
  13: 'Kind schläft'
};

new Chart(document.getElementById('dbChart'), {
  type: 'line',
  data: {
    labels,
    datasets: [
      {
        label: 'Lautstärke (dB)',
        data: daten,
        borderColor: '#f0a070',
        backgroundColor: 'rgba(240,160,112,0.15)',
        fill: true,
        tension: 0.42,
        pointRadius: daten.map((v,i) => events[i] ? 6 : 3),
        pointBackgroundColor: daten.map((v,i) => {
          if (i === 12) return '#ff6b6b';
          if (i === 13) return '#6be8b0';
          return '#f0a070';
        }),
        pointBorderColor: 'transparent',
        borderWidth: 2.5,
        segment: {
          borderColor: ctx => ctx.p0DataIndex >= 12 ? '#6be8b0' : '#f0a070',
        }
      },
      {
        label: 'WHO Nacht (40 dB)',
        data: Array(15).fill(40),
        borderColor: '#f08080',
        borderWidth: 1.5,
        borderDash: [5,4],
        pointRadius: 0,
        fill: false,
      },
      {
        label: 'TA-Lärm Tag (55 dB)',
        data: Array(15).fill(55),
        borderColor: '#7eb8f7',
        borderWidth: 1.5,
        borderDash: [5,4],
        pointRadius: 0,
        fill: false,
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#2a3050',
        titleColor: '#fefefe',
        bodyColor: '#cccccc',
        callbacks: {
          title: ctx => ctx[0].label + ' Uhr',
          label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y + ' dB',
          afterBody: ctx => {
            const i = ctx[0].dataIndex;
            return events[i] ? ['', events[i]] : [];
          }
        }
      }
    },
    scales: {
      x: {
        ticks: { color: '#fefefe', font: { family: "'Roboto Slab', serif", size: 11 }, maxRotation: 0 },
        grid: { color: 'rgba(255,255,255,0.08)' },
        border: { color: 'rgba(255,255,255,0.15)' }
      },
      y: {
        min: 20,
        max: 105,
        ticks: {
          color: '#fefefe',
          font: { family: "'Roboto Slab', serif", size: 11 },
          callback: v => v + ' dB',
          stepSize: 10
        },
        grid: { color: 'rgba(255,255,255,0.08)' },
        border: { color: 'rgba(255,255,255,0.15)' }
      }
    }
  }
});
</script>

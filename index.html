<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corabell Mag · Highlight-Reel einer Lovestory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- dekorative Herzen -->
    <div class="hearts" aria-hidden="true">
        <span class="heart h1">♥</span>
        <span class="heart h2">♥</span>
        <span class="heart h3">♥</span>
        <span class="heart h4">♥</span>
        <span class="heart h5">♥</span>
        <span class="heart h6">♥</span>
    </div>

    <header class="site-header">
        <div class="wrap">
            <p class="kicker">Corabell Mag · Hochzeitszeitung</p>
            <h1 class="logo">Highlight-Reel einer Lovestory- Deployment</h1>
            <p class="tagline">Die schönsten Momente in bewegten Bildern ♥</p>
        </div>
    </header>

    <main class="wrap">
        <!-- Hauptplayer -->
        <section class="player-section">
            <div class="player-frame">
                <video id="player" controls preload="metadata" playsinline></video>
            </div>
            <div class="player-meta">
                <h2 id="player-title">—</h2>
                <p id="player-desc"></p>
            </div>
        </section>

        <!-- Galerie -->
        <section class="gallery-section">
            <h3 class="section-heading">Alle Videos</h3>
            <div id="gallery" class="gallery"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap footer-row">
            <span class="footer-brand">CORABELL – MAGAZIN · <span id="year"></span></span>
            <span class="footer-page">♥</span>
            <span class="footer-section">SONDERHEFT – 2026</span>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>

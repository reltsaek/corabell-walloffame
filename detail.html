<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall of Fame · Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/detail.css">
</head>
<body>
<div class="detail-page">

  <!-- ── Navigation oben ─────────────── -->
  <nav class="detail-nav" aria-label="Seitennavigation">
    <button class="nav-btn" id="btnBack" aria-label="Zurück zur Übersicht">
      ← Übersicht
    </button>
    <span class="nav-center" id="navCounter">– / –</span>
    <div style="display:flex;gap:8px;">
      <button class="nav-btn" id="btnPrev" aria-label="Vorheriger Eintrag">‹</button>
      <button class="nav-btn" id="btnNext" aria-label="Nächster Eintrag">›</button>
    </div>
  </nav>
  <!-- ── lovestoryTitel Banner ─────────── -->
  <div class="wof-banner-wrap" id="wofBannerWrap" aria-label="Lovestory Kapitel">
    <div id="bannerBoard"></div>
  </div>
  <!-- ── Walk-of-Fame Karte ──────────── -->
  <article class="wof-card" id="wofCard" aria-label="Walk-of-Fame Karte">

    <!-- Zone 1: Sternfeld -->
    <div class="wof-star-zone">
      <!-- Sparkles (JS-generiert) -->
      <div class="sparkles" id="wofSparkles" aria-hidden="true"></div>
      <!-- Nummer im Sternkreis -->
      <span class="wof-nr" id="wofNr" aria-label="Nummer">#1</span>
    </div>

    <!-- Zone 2: Marquee-Schild (Zitat) -->
    <div class="wof-marquee-zone" id="wofMarqueeZone" aria-label="Filmzitat">
      <!-- JS baut das Marquee-Schild hier ein -->
    </div>

    <!-- Zone 3: Infopanel -->
    <div class="wof-info" aria-label="Filminformationen">
      <p class="wof-info-label">Dieses Zitat ist aus:</p>
      <p class="wof-info-sublabel">THIS PART IS FOR</p>
      <p class="wof-info-filmtitel" id="wofFilmtitel"></p>
      <p class="wof-info-meta" id="wofMeta"></p>
    </div>

  </article>



  <!-- ── Accordion ─────────────────────── -->
  <section class="wof-accordion" id="wofAccordion" aria-label="Weitere Details">

    <div class="accordion-item" id="accordionTeaser">
      <button class="accordion-trigger" aria-expanded="false" aria-controls="teaserBody">
        <span>Lösung anzeigen</span>
        <span class="accordion-icon" aria-hidden="true">▾</span>
      </button>
      <div class="accordion-body" id="teaserBody" role="region">
        <img id="teaserImg" src="" alt="" class="teaser-img">
      </div>
    </div>

    <div class="accordion-item" id="accordionSzene">
      <button class="accordion-trigger" aria-expanded="false" aria-controls="szeneBody">
        <span>Die Szene</span>
        <span class="accordion-icon" aria-hidden="true">▾</span>
      </button>
      <div class="accordion-body" id="szeneBody" role="region">
        <p id="szeneText"></p>
      </div>
    </div>

    <div class="accordion-item" id="accordionWer">
      <button class="accordion-trigger" aria-expanded="false" aria-controls="werBody">
        <span>Wer sagt's?</span>
        <span class="accordion-icon" aria-hidden="true">▾</span>
      </button>
      <div class="accordion-body" id="werBody" role="region">
        <p id="werText"></p>
      </div>
    </div>

  </section>

  <!-- ── Navigation unten ──────────────── -->
  <div class="detail-nav-bottom">
    <button class="nav-btn" id="btnPrev2" aria-label="Vorheriger Eintrag">← Zurück</button>
    <button class="nav-btn" id="btnNext2" aria-label="Nächster Eintrag">Weiter →</button>
  </div>

</div><!-- .detail-page -->

<script src="js/data.js"></script>
<script src="js/detail.js"></script>
</body>
</html>

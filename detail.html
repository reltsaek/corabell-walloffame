<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall of Fame · Detail</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/detail.css">
</head>
<body>
<div class="detail-page">

  <!-- ── Navigation oben ─────────────── -->
  <nav class="detail-nav" aria-label="Seitennavigation">
    <button type="button" class="nav-btn" id="btnBack" aria-label="Zurück zur Übersicht">
      ← Übersicht
    </button>
    <span class="nav-center" id="navCounter">– / –</span>
    <div class="nav-btn-group">
      <button type="button" class="nav-btn" id="btnPrev" aria-label="Vorheriger Eintrag">‹</button>
      <button type="button" class="nav-btn" id="btnNext" aria-label="Nächster Eintrag">›</button>
    </div>
  </nav>

  <!-- ── Banner über beiden Spalten ───── -->
  <div class="wof-banner-wrap" id="wofBannerWrap">
    <div id="bannerBoard"></div>
  </div>

  <!-- ── Zweispaltiges Layout ──────────── -->
  <div class="detail-columns">

    <!-- Linke Spalte: Karte -->
    <div class="detail-col-left">

      <article class="wof-card" id="wofCard" aria-label="Walk-of-Fame Karte">

        <!-- Zone 1: Sternfeld -->
        <div class="wof-star-zone">
          <div class="sparkles" id="wofSparkles" aria-hidden="true"></div>
          <span class="wof-nr" id="wofNr">#1</span>
        </div>

        <!-- Zone 2: Marquee-Schild (Zitat) -->
        <div class="wof-marquee-zone" id="wofMarqueeZone"></div>

        <!-- Zone 3: Infopanel -->
        <div class="wof-info">
          <p class="wof-info-label">Dieses Zitat ist aus:</p>
          <p class="wof-info-sublabel">THIS PART IS FOR</p>
          <p class="wof-info-filmtitel" id="wofFilmtitel"></p>
          <p class="wof-info-meta" id="wofMeta"></p>
        </div>

      </article>

    </div><!-- .detail-col-left -->

    <!-- Rechte Spalte: Accordion -->
    <div class="detail-col-right">

      <section class="wof-accordion" id="wofAccordion" aria-label="Weitere Details">

        <div class="accordion-item" id="accordionTeaser">
          <button type="button" id="btnTeaser" class="accordion-trigger" aria-expanded="false" aria-controls="teaserBody">
            <span>Lösung anzeigen</span>
            <span class="accordion-icon" aria-hidden="true">▾</span>
          </button>
          <section class="accordion-body" id="teaserBody" aria-labelledby="btnTeaser">
            <img id="teaserImg" src="#" alt="" class="teaser-img">
          </section>
        </div>

        <div class="accordion-item" id="accordionSzene">
          <button type="button" id="btnSzene" class="accordion-trigger" aria-expanded="false" aria-controls="szeneBody">
            <span>Die Szene</span>
            <span class="accordion-icon" aria-hidden="true">▾</span>
          </button>
          <section class="accordion-body" id="szeneBody" aria-labelledby="btnSzene">
            <p id="szeneText"></p>
          </section>
        </div>

        <div class="accordion-item" id="accordionWer">
          <button type="button" id="btnWer" class="accordion-trigger" aria-expanded="false" aria-controls="werBody">
            <span>Wer sagt's?</span>
            <span class="accordion-icon" aria-hidden="true">▾</span>
          </button>
          <section class="accordion-body" id="werBody" aria-labelledby="btnWer">
            <p id="werText"></p>
          </section>
        </div>

      </section>

    </div><!-- .detail-col-right -->

  </div><!-- .detail-columns -->

  <!-- ── Navigation unten ──────────────── -->
  <div class="detail-nav-bottom">
    <button type="button" class="nav-btn" id="btnPrev2" aria-label="Vorheriger Eintrag">← Zurück</button>
    <button type="button" class="nav-btn" id="btnNext2" aria-label="Nächster Eintrag">Weiter →</button>
  </div>

</div><!-- .detail-page -->

<script src="js/data.js"></script>
<script src="js/detail.js"></script>
</body>
</html>
